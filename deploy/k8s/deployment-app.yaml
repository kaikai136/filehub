apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-filehub
  namespace: middleware
  labels:
    app: devops-filehub
    component: app
spec:
  # InMemoryChannelLayer + SQLite => single writer. Do not scale beyond 1.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: devops-filehub
      component: app
  template:
    metadata:
      labels:
        app: devops-filehub
        component: app
    spec:
      containers:
        - name: app
          image: registry.cn-beijing.aliyuncs.com/kaikai136/filehub-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: static
              mountPath: /app/backend/staticfiles

            - name: app-config
              mountPath: /etc/filehub/config.yaml
              subPath: config.yaml
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi

      volumes:
        - name: static
          hostPath:
            path: /data/middleware/devops-filehub/static
            type: DirectoryOrCreate
        - name: data
          hostPath:
            path: /data/middleware/devops-filehub/data
            type: DirectoryOrCreate
        # - name: runtime
        #   persistentVolumeClaim:
        #     claimName: devops-filehub-runtime-pvc
        - name: app-config
          configMap:
            name: devops-filehub-config
            items:
              - key: config.yaml
                path: config.yaml
