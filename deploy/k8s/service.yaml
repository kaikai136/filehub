apiVersion: v1
kind: Service
metadata:
  name: devops-filehub-app
  namespace: middleware
  labels:
    app: devops-filehub
    component: app
spec:
  type: ClusterIP
  #type: NodePort
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
      # nodePort: 30271
  selector:
    app: devops-filehub
    component: app
---
apiVersion: v1
kind: Service
metadata:
  name: devops-filehub-web
  namespace: middleware
  labels:
    app: devops-filehub-web
    component: filehub-web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: devops-filehub-web
    component: filehub-web
