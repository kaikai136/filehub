apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-filehub-config
  namespace: middleware
data:
  config.yaml: |

    # Replace with a long, unique random value before deployment.
    # This key also encrypts stored SSH credentials; keep it backed up and stable.
    secret_key: REPLACE_WITH_A_LONG_RANDOM_SECRET
    debug: false

    allowed_hosts:
      - filehub.xunsiya.top
      - localhost
      - 127.0.0.1

    csrf_trusted_origins:
      - https://filehub.xunsiya.top

    cors_allowed_origins:
      - https://filehub.xunsiya.top

    database:
      # Supported engines: sqlite, mysql. MySQL/MariaDB must be reachable from backend container.
      engine: sqlite
      name: /data/filehub.sqlite3
      options:
        timeout: 30
      # To use MySQL, replace the engine/name/options above with this configuration:
      # engine: mysql
      # name: filehub
      # user: filehub
      # password: "CHANGE_ME"
      # host: mysql.example.internal  # Do not use localhost for an external database.
      # port: 3306
      # conn_max_age: 60
      # conn_health_checks: true
      # options:
      #   charset: utf8mb4
      #   connect_timeout: 10

    channels:
      # Use redis for multiple ASGI workers/instances; Redis is not bundled in Compose.
      backend: memory
      redis:
        url: redis://127.0.0.1:6379/0
      # Set backend: redis to activate this URL. Use rediss:// for TLS.

    application:
      language_code: zh-hans
      time_zone: Asia/Shanghai
      use_i18n: true
      use_tz: true
      static_url: /static/
      static_root: /app/backend/staticfiles
      data_upload_max_memory_size: 2621440
      file_upload_max_memory_size: 2621440
      # file_upload_temp_dir: /tmp

    security:
      # Enable when requests arrive through a trusted proxy that sets X-Forwarded-Proto.
      trust_proxy_ssl_header: true
      # Keep false behind TLS termination unless Django itself should redirect HTTP.
      secure_ssl_redirect: false
      session_cookie_secure: false
      csrf_cookie_secure: false
      session_cookie_httponly: true
      csrf_cookie_httponly: false
      # Set HSTS only after HTTPS works correctly for this domain.
      hsts_seconds: 0
      hsts_include_subdomains: false
      hsts_preload: false
      content_type_nosniff: true
      referrer_policy: same-origin
      use_x_forwarded_host: false

  nginx.conf: |
    map $http_x_forwarded_proto $filehub_forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://devops-filehub-app:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $filehub_forwarded_proto;
        }

        location /admin/ {
            proxy_pass http://devops-filehub-app:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $filehub_forwarded_proto;
        }

        location /static/ {
            alias /srv/filehub-static/;
            expires 7d;
            add_header Cache-Control "public";
        }

        location /ws/ {
            proxy_pass http://devops-filehub-app:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $filehub_forwarded_proto;
            proxy_read_timeout 3600s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }


