services:
  backend:
    image: filehub-backend:latest
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./config.yaml:/etc/filehub/config.yaml:ro
      - ./data/filehub_data:/data
      - ./data/filehub_static:/app/backend/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: filehub-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/filehub_static:/srv/filehub-static:ro

