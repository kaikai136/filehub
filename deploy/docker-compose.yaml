services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in deploy/.env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      SQLITE_PATH: /data/filehub.sqlite3
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
    volumes:
      - filehub_data:/data
      - filehub_static:/app/backend/staticfiles
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FILEHUB_PORT:-8080}:80"
    volumes:
      - filehub_static:/srv/filehub-static:ro
    restart: unless-stopped

volumes:
  filehub_data:
  filehub_static:
